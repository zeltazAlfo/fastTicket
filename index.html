<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page de redirection avec compte à rebours</title>
    <style>
        /* CSS sombre */
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        h1 {
            text-align: center;
            color: #ff4081;
        }

        p, label {
            font-size: 18px;
            color: #bbb;
        }

        input, button {
            background-color: #333;
            color: #fff;
            border: 1px solid #444;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            width: 100%;
            max-width: 300px;
        }

        input[type="datetime-local"] {
            background-color: #222;
        }

        button:hover {
            background-color: #ff4081;
            cursor: pointer;
        }

        #inputForm {
            display: none;
            text-align: center;
        }

        #countdown {
            font-size: 24px;
            margin-top: 20px;
            color: #4caf50;
        }

        .container {
            text-align: center;
        }

    </style>
    <script>
        // Fonction pour récupérer un paramètre de l'URL
        function getUrlParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        // Fonction pour mettre à jour la page en fonction des paramètres
        function updatePage() {
            const url = getUrlParameter('url');
            const time = getUrlParameter('time');
            const form = document.getElementById('inputForm');
            const countdownDisplay = document.getElementById('countdown');

            if (url && time) {
                const targetTime = new Date(parseInt(time));
                const interval = setInterval(function () {
                    const currentTime = new Date();
                    const remainingTime = targetTime - currentTime;

                    if (remainingTime <= 0) {
                        clearInterval(interval);
                        window.location.href = url; // Rediriger vers l'URL
                    } else {
                        const secondsLeft = Math.ceil(remainingTime / 1000);
                        countdownDisplay.textContent = 'Temps restant: ' + secondsLeft + ' secondes';
                    }
                }, 1000);
            } else {
                form.style.display = 'block';
            }
        }

        // Fonction pour recharger la page avec les paramètres saisis
        function reloadWithParams() {
            const urlInput = document.getElementById('urlInput').value;
            const timeInput = document.getElementById('timeInput').value;
            if (urlInput && timeInput) {
                const timeInMilliseconds = new Date(timeInput).getTime();
                window.location.search = `?url=${encodeURIComponent(urlInput)}&time=${timeInMilliseconds}`;
            } else {
                alert('Veuillez remplir tous les champs.');
            }
        }

        window.onload = updatePage;
    </script>
</head>
<body>
    <div class="container">
        <h1>Page de redirection avec compte à rebours</h1>
        <p id="countdown"></p>

        <!-- Formulaire pour saisir URL et Heure si les paramètres sont absents -->
        <div id="inputForm">
            <h2>Veuillez entrer l'URL et l'heure de redirection:</h2>
            <label for="urlInput">URL:</label>
            <input type="text" id="urlInput" placeholder="https://exemple.com"><br><br>
            <label for="timeInput">Heure de redirection (format : YYYY-MM-DD HH:mm:ss):</label>
            <input type="datetime-local" id="timeInput"><br><br>
            <button onclick="reloadWithParams()">Confirmer</button>
        </div>
    </div>
</body>
</html>
